<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Lista de Videojuegos</h2>

<a href="/nuevo" class="btn btn-primary mb-3">Nuevo Videojuego</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Género</th>
            <th>Precio</th>
            <th>Plataforma</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="v : ${videojuegos}">
            <td th:text="${v.id}"></td>
            <td th:text="${v.titulo}"></td>
            <td th:text="${v.genero}"></td>
            <td th:text="${v.precio}"></td>
            <td th:text="${v.plataforma != null ? v.plataforma.nombre : 'Sin plataforma'}"></td>
            <td>
                <a th:href="@{/editar/{id}(id=${v.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/eliminar/{id}(id=${v.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
