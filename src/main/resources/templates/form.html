<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Formulario Videojuego</h2>

<form th:action="@{/guardar}" th:object="${videojuego}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Título</label>
        <input type="text" th:field="*{titulo}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Género</label>
        <input type="text" th:field="*{genero}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Precio</label>
        <input type="number" step="0.01" th:field="*{precio}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label>Plataforma</label>
        <select name="plataforma.id" class="form-select" required>
            <option value="">-- Selecciona una plataforma --</option>
            <option th:each="p : ${plataformas}"
                    th:value="${p.id}"
                    th:text="${p.nombre}"
                    th:selected="${videojuego.plataforma != null and videojuego.plataforma.id == p.id}">
            </option>
        </select>
    </div>

    <button class="btn btn-success">Guardar</button>
    <a href="/" class="btn btn-secondary">Cancelar</a>

</form>

</body>
</html>
